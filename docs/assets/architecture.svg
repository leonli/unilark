<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">Unilark architecture / Unilark 架构</title>
  <desc id="desc">Lark private chat and session groups connect to a local gateway. SQLite owns gateway state; AGY retains native conversations and execution. Mermaid images render on the host.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6080aa" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#182b49}
      .title{font-size:29px;font-weight:700}.section{font-size:19px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:15px;fill:#465e7e}.small{font-size:12px;fill:#536d90}.line{fill:none;stroke:#6080aa;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="650" rx="20" fill="#f7f9fd"/>
  <rect x="30" y="28" width="6" height="58" rx="3" fill="#2464db"/>
  <text x="51" y="54" class="title">Unilark · Shared conversations / 共享会话</text>
  <text x="51" y="82" class="body">One group per session. Keep your existing agent. / 一会话一群，沿用原有 Agent。</text>
  <rect x="30" y="125" width="310" height="425" rx="18" fill="#eaf1ff" stroke="#cbdaf6"/>
  <text x="51" y="164" class="section">Lark / 飞书</text>
  <rect x="50" y="187" width="270" height="91" rx="12" fill="white" stroke="#d1def4"/>
  <text x="67" y="219" class="label">Bot private chat / 机器人私聊</text>
  <text x="67" y="245" class="body">Create · Open · Settings</text>
  <text x="67" y="265" class="small">新建会话 · 打开会话 · 设置</text>
  <rect x="50" y="312" width="270" height="82" rx="12" fill="white" stroke="#d1def4"/>
  <text x="67" y="344" class="label">Session A / 会话群 A</text>
  <text x="67" y="372" class="body">Owner + bot / 本人 + 机器人</text>
  <rect x="50" y="414" width="270" height="82" rx="12" fill="white" stroke="#d1def4"/>
  <text x="67" y="446" class="label">Session B / 会话群 B</text>
  <text x="67" y="474" class="body">Fixed binding / 固定原生会话</text>
  <text x="51" y="530" class="small">Switch in the chat list / 在聊天列表切换</text>
  <rect x="440" y="125" width="610" height="425" rx="18" fill="white" stroke="#b9c9e1" stroke-dasharray="7 5"/>
  <text x="461" y="164" class="section">Your host / 私有主机</text>
  <text x="461" y="186" class="small">Same OS user · Local AGY instance / 同一系统用户 · 指定本机实例</text>
  <rect x="460" y="218" width="245" height="134" rx="12" fill="#2464db"/>
  <text x="479" y="252" style="font-size:22px;font-weight:700;fill:white">Unilark gateway</text>
  <text x="479" y="278" style="font-size:17px;fill:white">本机会话网关</text>
  <text x="479" y="306" style="font-size:14px;fill:#e5edff">Routing · Queue · Cards</text>
  <text x="479" y="330" style="font-size:14px;fill:#e5edff">路由 · 排队 · 审批 · 消息投递</text>
  <rect x="775" y="218" width="255" height="134" rx="12" fill="#edf4ff" stroke="#cbdaf6"/>
  <text x="793" y="252" class="label">Existing AGY / 原有 AGY</text>
  <text x="793" y="282" class="body">Login · Model · Native history</text>
  <text x="793" y="308" class="body">登录 · 模型 · 原生历史</text>
  <text x="793" y="332" class="small">Execution &amp; tool authorization / 执行与授权</text>
  <path d="M341 266H458" class="line"/>
  <text x="351" y="240" class="small">WebSocket</text>
  <text x="363" y="258" class="small">+ HTTPS</text>
  <path d="M708 275H772" class="line"/>
  <text x="714" y="246" class="small">Local API</text>
  <text x="715" y="263" class="small">本机接口</text>
  <rect x="460" y="421" width="245" height="95" rx="12" fill="#f1f5fa" stroke="#d5dfec"/>
  <text x="479" y="454" class="label">SQLite</text>
  <text x="479" y="480" class="body">Bindings · Inbox · Outbox</text>
  <text x="479" y="502" class="small">会话绑定 · 输入队列 · 消息投递记录</text>
  <path d="M582 355V418" class="line"/>
  <text x="596" y="391" class="small">Persist / 持久化</text>
  <rect x="775" y="421" width="255" height="95" rx="12" fill="#eef8f5" stroke="#c7e4da"/>
  <text x="793" y="454" class="label">Markdown + Mermaid</text>
  <text x="793" y="480" class="body">Local rendering / 本机渲染</text>
  <text x="793" y="502" class="small">Rich answers &amp; images / 富文本和图表</text>
  <path d="M707 327H741V394H900V419" class="line"/>
  <text x="785" y="385" class="small">Render / 渲染</text>
  <text x="31" y="590" class="body">Native history stays in AGY. Gateway state stays in SQLite.</text>
  <text x="31" y="615" class="body">原生历史由 AGY 保留；路由、队列和投递状态由网关保存。</text>
</svg>
