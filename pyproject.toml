[project]
name = "unilark"
version = "0.0.4"
description = "以 Lark 为移动交互入口、可接入不同本地 Agent sidecar 的常驻会话网关"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }   # PRD 18 节第 1 项待拍板前不写猜测许可证
dependencies = ["httpx==0.28.1", "markdown-it-py==4.2.0"]

[project.optional-dependencies]
lark = ["lark-channel-sdk==1.4.0", "playwright==1.62.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
unilark = "unilark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unilark"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # 测试里用 assert

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/unilark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # src layout：不装包也能跑测试
asyncio_mode = "auto"
markers = [
  # PRD 12.4：禁止以 fake adapter 全绿替代真实 harness 验收。真机用例单独打标，
  # CI 默认不跑，发布前必须在真实 AGY 上跑过。
  "real_agy: 需要真实 AGY 桌面端在跑",
  "real_lark: 需要真实 Lark 租户与应用",
  "local_browser: 需要 Playwright Chromium，仅在本机渲染图表",
]
